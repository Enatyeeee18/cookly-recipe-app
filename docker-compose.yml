version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cookly-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cookly_root
      MYSQL_DATABASE: cookly
      MYSQL_USER: cookly
      MYSQL_PASSWORD: cookly_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: cookly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Optional: Adminer for database management
  adminer:
    image: adminer
    container_name: cookly-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql

volumes:
  mysql_data:
  redis_data:
